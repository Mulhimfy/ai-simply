name: Daily AI News Snapshot

on:
  schedule:
    # 07:00 UTC daily (~03:00 America/New_York)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch today's AI news
        run: node scripts/fetch-news.mjs

      # Writes src/data/briefs/<date>.json. Without the secret the script prints a notice and
      # exits 0, and the site falls back to the automatic brief built from the snapshot.
      - name: Write today's brief
        run: node scripts/write-brief.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit snapshot and brief if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news/ src/data/briefs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "chore(news): snapshot and brief for $DATE"
          git push
